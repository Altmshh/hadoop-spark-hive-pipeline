stages:
  - test
  - run
  - deploy

run_unit_tests:
  stage: test
  image: python:3.9
  script:
    - pip install pytest pyspark
    - pytest tests/

run_pipeline_scripts:
  stage: run
  image: python:3.9
  script:
    - pip install pandas pyarrow
    - echo "Executing data pipeline layers..."
    - python run_bronze_ingest.py
    - python src/transformation/run_silver_transform.py
    - python src/gold/run_gold_aggregation.py

deploy_to_env:
  stage: deploy
  image: python:3.9
  script:
    - echo "Starting deployment to target environment..."
    - echo "Pipeline artifacts deployed successfully!"
  only:
    - develop
    - main