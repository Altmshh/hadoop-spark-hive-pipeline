stages:
  - test
  - deploy

run_unit_tests:
  stage: test
  image: python:3.9
  script:
    - pip install pytest pyspark
    - pytest tests/

deploy_to_env:
  stage: deploy
  image: python:3.9
  script:
    - echo "Starting deployment to target environment..."
    - echo "Pipeline artifacts deployed successfully!"
  only:
    - develop
    - main